name: Client checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Check committed runtime is current
        run: git diff --exit-code -- plugins/loom-memory/dist/cli.js plugins/loom-memory/THIRD_PARTY_NOTICES.txt
